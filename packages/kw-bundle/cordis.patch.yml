- id: session-log-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: llm-pi-ai
  config:
    providers: !!js "process.env.KW_CHAT_BASE_URL && process.env.KW_LLM_MODEL ? { [process.env.KW_LLM_PROVIDER || 'kw-chat']: { displayName: 'KWAgent Chat', api: 'openai-completions', baseURL: process.env.KW_CHAT_BASE_URL, apiKeyEnv: 'KW_CHAT_API_KEY', defaultContextWindow: 131072, defaultMaxTokens: 8192, defaultInput: ['text', 'image'], models: [{ id: process.env.KW_LLM_MODEL, name: process.env.KW_LLM_MODEL, contextWindow: 131072, maxTokens: 8192 }] } } : {}"
- insert:
    - id: kw-mind
      name: '@kwagent/kw-mind'
    - id: kw-lagrange
      name: '@kwagent/kw-lagrange'
    - id: kw-life
      name: '@kwagent/kw-life'
    - id: kw-panel
      name: '@kwagent/kw-panel'
