- id: session-log-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: tool-executor-native
  disabled: true
- id: tool-executor-ptc
  disabled: false
- id: ptc-runtime
  config:
    executionMode: per-call
    scriptPersistence: false
- id: llm-pi-ai
  config:
    providers:
      kw-chat:
        displayName: KWAgent Chat
        api: openai-completions
        baseURL: https://workbuddy2api.d1no.cn/v1
        apiKeyEnv: KW_CHAT_API_KEY
        defaultInput: [text, image]
        reasoning: medium
        compat:
          thinkingFormat: deepseek
        models:
          - id: cn:deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
- insert:
    - id: kw-mind
      name: '@kwagent/kw-mind'
    - id: kw-lagrange
      name: '@kwagent/kw-lagrange'
    - id: kw-life
      name: '@kwagent/kw-life'
    - id: kw-panel
      name: '@kwagent/kw-panel'
