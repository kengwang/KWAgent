- id: session-log-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: llm-pi-ai
  config:
    providers: !!js "process.env.KW_CHAT_BASE_URL && process.env.KW_LLM_MODEL ? { [process.env.KW_LLM_PROVIDER || 'kw-chat']: { displayName: 'KWAgent Chat', api: 'openai-completions', baseURL: process.env.KW_CHAT_BASE_URL, apiKeyEnv: 'KW_CHAT_API_KEY', defaultInput: ['text', 'image'], ...(process.env.KW_CHAT_THINKING_FORMAT ? { reasoning: 'medium' } : {}), models: [{ id: process.env.KW_LLM_MODEL, name: process.env.KW_LLM_MODEL, ...(process.env.KW_CHAT_THINKING_FORMAT ? { reasoningEfforts: { off: null, low: 'low', medium: 'medium', high: 'high' }, compat: { thinkingFormat: process.env.KW_CHAT_THINKING_FORMAT } } : {}) }] } } : {}"
- insert:
    - id: kw-mind
      name: '@kwagent/kw-mind'
    - id: kw-lagrange
      name: '@kwagent/kw-lagrange'
    - id: kw-life
      name: '@kwagent/kw-life'
    - id: kw-panel
      name: '@kwagent/kw-panel'
