services:
  kwagent:
    image: ${KW_IMAGE:-ghcr.io/kengwang/kwagent:0.6.2}
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KW_DATA_ROOT: /data
      DSH_HOME: /data/dsh
      KW_CONTAINER: 'true'
      KW_PUBLIC_URL: ${KW_PUBLIC_URL:?请配置 HTTPS 管理域名}
      HTTP_PROXY: ${KW_RUNTIME_PROXY:-}
      HTTPS_PROXY: ${KW_RUNTIME_PROXY:-}
      TZ: ${KW_TIME_ZONE:-Asia/Shanghai}
    volumes:
      - '${KW_DATA_ROOT:-./data/agent}:/data'
    networks:
      1panel-network:
        aliases:
          - kwagent
    cpus: ${KW_CPU_LIMIT:-2}
    mem_limit: ${KW_MEMORY_LIMIT:-4g}
    shm_size: 1gb
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'node', 'scripts/healthcheck.mjs']
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

networks:
  1panel-network:
    external: true
    name: 1panel-network
